name: Send Batspool report
on:
  schedule:
    # UTC triggers cover both EST and EDT, avoiding timezone-specific scheduler behavior.
    # The local-time gate sends at 10:00-11:00 Toronto time; IMAP prevents duplicates.
    - cron: '53 13,14 * * 0,3,5'
    - cron: '33 15 * * 0,3,5'
  push:
    branches: [main]
    paths: ['.github/workflows/weekly.yml']
  workflow_dispatch:
    inputs:
      report_mode:
        description: Send a scheduled report or a test
        required: true
        default: test
        type: choice
        options:
          - test
          - full
      report_date:
        description: Optional historical report date (YYYY-MM-DD)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: batspool-weekly-email
  cancel-in-progress: false
jobs:
  email:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[send-nov27]'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: live
    steps:
      - name: Hold until 10 a.m. Toronto or skip out-of-window runs
        id: timing
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import datetime as dt
          import os
          import time
          from zoneinfo import ZoneInfo
          now = dt.datetime.now(ZoneInfo("America/Toronto"))
          target = now.replace(hour=10, minute=0, second=0, microsecond=0)
          eligible = now.weekday() in (2, 4, 6) and target - dt.timedelta(minutes=10) <= now < target + dt.timedelta(hours=1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("send=" + str(eligible).lower() + "\n")
          if eligible:
              time.sleep(max(0, (target - now).total_seconds()))
          else:
              print("Outside delivery window; skipping without sending")
          PY
      - uses: actions/checkout@v4
        if: steps.timing.outputs.send != 'false'
      - name: Validate Python syntax
        if: steps.timing.outputs.send != 'false'
        run: python3 -m py_compile weekly_report.py
      - name: Restore live scoring checkpoint
        if: steps.timing.outputs.send != 'false'
        env:
          LIVE_STATE_KEY: ${{ secrets.LIVE_STATE_KEY }}
        run: |
          test -n "$LIVE_STATE_KEY"
          git fetch origin refs/heads/live-state:refs/remotes/origin/live-state
          git show origin/live-state:scores.json.gpg > "$RUNNER_TEMP/scores.json.gpg"
          gpg --batch --pinentry-mode loopback --passphrase-fd 0 --decrypt \
            --output "$RUNNER_TEMP/scores.json" "$RUNNER_TEMP/scores.json.gpg" <<< "$LIVE_STATE_KEY"
      - name: Check SMTP configuration
        if: steps.timing.outputs.send != 'false'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: test -n "$GMAIL_APP_PASSWORD" || { echo '::error::GMAIL_APP_PASSWORD missing'; exit 1; }
      - name: Calculate and send report
        if: steps.timing.outputs.send != 'false'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WEEKLY_RECIPIENTS: ${{ secrets.WEEKLY_RECIPIENTS }}
          CONTESTANT_NAMES: ${{ secrets.CONTESTANT_NAMES }}
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            python3 weekly_report.py --checkpoint "$RUNNER_TEMP/scores.json" --report-date 2026-11-27 --send
          elif [[ -n "$REPORT_DATE" ]]; then
            python3 weekly_report.py --checkpoint "$RUNNER_TEMP/scores.json" --report-date "$REPORT_DATE" --send
          elif [[ "${{ github.event_name }}" == 'workflow_dispatch' && "${{ inputs.report_mode }}" == 'test' ]]; then
            python3 weekly_report.py --checkpoint "$RUNNER_TEMP/scores.json" --test --send
          else
            python3 weekly_report.py --checkpoint "$RUNNER_TEMP/scores.json" --send
          fi
      - name: Remove local decrypted scoring state
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/scores.json" ]]; then shred -u "$RUNNER_TEMP/scores.json" || true; fi
