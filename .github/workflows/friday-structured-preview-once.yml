name: One-time Batspool Friday structured-results preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/friday-structured-preview-once.yml']
permissions:
  contents: read
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: live
    steps:
      - uses: actions/checkout@v4
      - name: Validate report generator
        run: |
          python3 -m py_compile weekly_report.py
          python3 -m unittest discover -s tests -p 'test_weekly_report.py'
      - name: Restore encrypted scoring checkpoint
        env:
          LIVE_STATE_KEY: ${{ secrets.LIVE_STATE_KEY }}
        run: |
          test -n "$LIVE_STATE_KEY"
          git fetch origin refs/heads/live-state:refs/remotes/origin/live-state
          git show origin/live-state:scores.json.gpg > "$RUNNER_TEMP/scores.json.gpg"
          gpg --batch --pinentry-mode loopback --passphrase-fd 0 --decrypt \
            --output "$RUNNER_TEMP/scores.json" "$RUNNER_TEMP/scores.json.gpg" <<< "$LIVE_STATE_KEY"
      - name: Generate updated November 27 email and send ONLY to account holder
        env:
          CONTESTANT_NAMES: ${{ secrets.CONTESTANT_NAMES }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage
          from pathlib import Path
          from render_chart import live_names, relabel
          from weekly_report import build_report, SENDER
          pool = json.loads((Path(os.environ["RUNNER_TEMP"]) / "scores.json").read_text())
          pool = relabel(pool, live_names(pool))
          subject, body = build_report(pool, dt.date(2026, 11, 27))
          assert subject == "The Friday Check-Up | Batspool2027"
          assert "Wednesday–Thursday Review" in body
          assert "Nov 25–Nov 26" in body
          assert "Around the NHL" in body
          assert "Winner" in body and "Loser" in body
          assert 'width="26" height="26"' in body
          assert "Upcoming NHL Games" in body
          assert "LG" in body
          msg = EmailMessage()
          msg["From"] = SENDER
          msg["To"] = SENDER
          msg["Subject"] = subject + " — Updated Layout"
          msg.set_content("Updated Friday, November 27 Batspool report. Please view the HTML version.")
          msg.add_alternative(body, subtype="html")
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=ssl.create_default_context(), timeout=30) as smtp:
              smtp.login(SENDER, os.environ["GMAIL_APP_PASSWORD"])
              refused = smtp.send_message(msg, to_addrs=[SENDER])
              if refused:
                  raise RuntimeError("Recipient rejected by SMTP")
          print("One-recipient Friday updated layout delivered to Gmail SMTP")
          PY
      - name: Remove temporary plaintext checkpoint
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/scores.json" ]]; then shred -u "$RUNNER_TEMP/scores.json" || true; fi
