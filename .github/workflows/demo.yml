name: Publish public demo
on:
  push:
    branches: [main]
    # Only rebuild the public demo when its sources or the deployment workflow
    # change; email/report edits must not launch irrelevant Pages deployments.
    paths:
      - 'render_chart.py'
      - 'scripts/**'
      - 'data/**'
      - 'assets/**'
      - 'images/**'
      - 'static/**'
      - 'requirements*.txt'
      - '.github/workflows/demo.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  demo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: python3 render_chart.py --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: publish
